name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  BUILD_TOOLS: "36.0.0"
  APP_ID: "com.sumpilot"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36 and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle (uses the committed wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release lint
        run: ./gradlew --no-daemon lintRelease

      - name: Debug build (no release credentials needed)
        run: ./gradlew --no-daemon assembleDebug

      - name: Check signing secrets
        id: secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signed release artifacts are skipped."
          fi

      - name: Decode PKCS12 release keystore
        if: steps.secrets.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS_PATH="$RUNNER_TEMP/release-upload.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: steps.secrets.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature
        if: steps.secrets.outputs.present == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          if grep -q "CN=Android Debug" apk-signature.txt; then
            echo "::error::APK is signed with the Android debug certificate"; exit 1
          fi

      - name: Verify AAB signature and signer
        if: steps.secrets.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB" > aab-verify.txt 2>&1 || {
            # -strict also fails on a self-signed upload certificate; that is expected and valid
            # for Play upload keys, so fall back to the non-strict integrity check.
            jarsigner -verify -verbose -certs "$AAB" > aab-verify.txt 2>&1
          }
          grep -q "jar verified." aab-verify.txt || { echo "::error::AAB signature verification failed"; tail -50 aab-verify.txt; exit 1; }
          if grep -q "CN=Android Debug" aab-verify.txt; then echo "::error::AAB signed with debug certificate"; exit 1; fi
          # The AAB signer must be the release keystore's certificate.
          EXPECTED=$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | grep -m1 "SHA256:" | awk '{print $2}')
          ACTUAL=$(keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "Expected signer SHA-256: $EXPECTED"
          echo "Actual   signer SHA-256: $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::AAB signer does not match the release keystore"; exit 1; }
          keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA256:" > aab-signer.txt

      - name: Check release permissions
        if: steps.secrets.outputs.present == 'true'
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" APP_ID="$APP_ID" \
            scripts/check_permissions.sh app/build/outputs/apk/release/app-release.apk | tee permissions-report.txt
          # The merged manifest must not contain network permissions either.
          MERGED=$(find app/build/intermediates -path "*release*" -name AndroidManifest.xml | head -1)
          echo "Merged manifest: $MERGED"
          ! grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" "$MERGED"

      - name: 16 KB native-library inspection
        if: steps.secrets.outputs.present == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          python3 scripts/check_native_libs.py "$APK" "$AAB" | tee native-libs-report.md
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > zipalign-report.txt && echo "zipalign -P 16: OK" | tee -a native-libs-report.md

      - name: Upload verified release artifacts
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sumpilot-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            apk-signature.txt
            aab-signer.txt
            permissions-report.txt
            native-libs-report.md

      - name: Upload reports and Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumpilot-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then rm -f "$ANDROID_KEYSTORE_PATH"; fi
          rm -f "$RUNNER_TEMP"/*.p12
